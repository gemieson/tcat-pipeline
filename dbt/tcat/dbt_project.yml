name: 'tcat'
version: '1.0.0'
profile: 'tcat'   # defined in ~/.dbt/profiles.yml (written by deploy/setup_dbt.sh)

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  tcat:
    staging:
      # tables, so raw JSON is read once per build, not by every downstream
      # model and test (docs/DECISIONS.md, D4)
      +materialized: table
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      +schema: tcat_marts   # see macros/generate_schema_name.sql
