version: 2

models:
  - name: int_vehicle_positions_deduped
    description: One row per real bus report. Exact duplicates removed; stale reports flagged.
    columns:
      - name: vehicle_id
        tests: [not_null]
      - name: vehicle_reported_at
        tests: [not_null]
      - name: is_stale
        description: True when the report was collected more than 120s after the bus sent it.

  - name: int_vehicle_stop_arrivals
    description: One row each time a bus reaches a new stop on a trip.
    columns:
      - name: stop_name
        tests: [not_null]
      - name: arrived_at
        tests: [not_null]