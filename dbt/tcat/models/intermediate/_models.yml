version: 2

models:
  - name: int_vehicle_positions_deduped
    description: One row per real bus report. Exact duplicates removed; stale reports flagged.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [vehicle_id, vehicle_reported_at]
    columns:
      - name: vehicle_id
        data_tests: [not_null]
      - name: vehicle_reported_at
        data_tests: [not_null]
      - name: is_stale
        description: True when collected more than 120s after the bus sent it.

  - name: int_vehicle_stop_arrivals
    description: One row each time a bus reaches a new stop on a trip.
    columns:
      - name: stop_name
        data_tests: [not_null]
      - name: arrived_at
        data_tests: [not_null]
      - name: seconds_from_prev_stop
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 3600}
              config: {severity: warn}

  - name: int_stop_actuals
    description: One row per trip per stop per service day, with TCAT's recorded arrival (ATA) when present.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [service_date, stop_id, route_id, trip_id]
    columns:
      - name: scheduled_arrival_at
        data_tests: [not_null]
      - name: delay_seconds
        description: actual_arrival_at - scheduled_arrival_at. Positive = late.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -1800, max_value: 5400}   # 30 min early .. 90 min late
              config: {severity: warn}

  - name: int_stop_arrivals_filled
    description: >
      int_stop_actuals with missing TCAT arrivals filled from the GPS feed
      (calibrated for GPS running late). Same grain: one row per trip per stop
      per service day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [service_date, stop_id, route_id, trip_id]
    columns:
      - name: stop_name
        description: From seeds/watched_stops. Null means the stop is missing from the seed.
        data_tests: [not_null]
      - name: arrival_source
        description: "'tcat' = TCAT's recorded arrival, 'gps' = calibrated GPS arrival, null = not measured."
        data_tests:
          - accepted_values:
              arguments: {values: ['tcat', 'gps']}
      - name: gps_lag_seconds
        description: Median seconds GPS arrival trails TCAT's record, measured on trips that have both. ~54s in Sep data.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -60, max_value: 300}
              config: {severity: warn}
      - name: delay_seconds
        description: best_arrival_at - scheduled_arrival_at. Positive = late.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -1800, max_value: 5400}
              config: {severity: warn}
