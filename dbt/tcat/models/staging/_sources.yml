version: 2

sources:
  - name: tcat_raw
    description: External tables over raw files in GCS (sql/01_external_tables.sql, sql/02_request_log.sql).
    database: tcat-pipeline
    schema: tcat_raw
    # Freshness: is new data still arriving? Catches a dead producer/consumer.
    # 6h error threshold allows for the overnight gap when no buses run.
    config:
      loaded_at_field: "timestamp(ingested_at)"
      freshness:
        warn_after: {count: 2, period: hour}
        error_after: {count: 6, period: hour}
        filter: "dt >= date_sub(current_date(), interval 1 day)"
    tables:
      - name: ext_vehicle_positions
        description: One row per bus per 30s poll. Envelope columns + untouched TCAT payload (JSON).
      - name: ext_stop_departures
        description: One row per predicted trip per stop per 60s poll. Envelope columns + untouched payload (JSON).
      - name: ext_request_log
        description: >
          One row per API call, from the producer (with delivery counts) and the
          side collector. Local NDJSON synced to GCS hourly (sql/02_request_log.sql).
        config:
          loaded_at_field: "timestamp(ingest_ts)"
          freshness:   # synced hourly, so allow for one missed sync
            warn_after: {count: 3, period: hour}
            error_after: {count: 7, period: hour}
            filter: "dt >= date_sub(current_date(), interval 1 day)"
